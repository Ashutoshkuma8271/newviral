<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Home-page defaults. Each route updates these in the browser (src/lib/usePageMeta.ts).
         %SITE_URL% is replaced at build time from SITE_URL in vite.config.ts. -->
    <title>Vyral Bee | Digital Marketing Agency for Social, Web &amp; Ads</title>
    <meta name="description" content="Vyral Bee plans, creates and runs your social media, design, video, website and ads as one system, so your brand gets seen and chosen." />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vyral Bee" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Vyral Bee | Digital Marketing Agency for Social, Web &amp; Ads" />
    <meta property="og:description" content="Social media, design, video, websites and ads, planned by one team so your brand gets seen and chosen." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vyral Bee: We make brands visible. Social media, design, video, websites and ads." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vyral Bee | Digital Marketing Agency for Social, Web &amp; Ads" />
    <meta name="twitter:description" content="Social media, design, video, websites and ads, planned by one team so your brand gets seen and chosen." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Structured data: facts only (no ratings or social links until real ones are confirmed) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "Vyral Bee",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "description": "Vyral Bee is a creative digital marketing agency helping businesses build a strong online presence, attract the right audience, and generate measurable growth.",
            "telephone": "+91-85128-77877",
            "email": "info@akirafresh.in",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "R-18, Vikas Marg, Laxmi Nagar, Near Nirman Vihar Metro Station, Pillar No. 48",
              "addressLocality": "New Delhi",
              "addressRegion": "Delhi",
              "postalCode": "110092",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "name": "Viral Bee",
            "url": "%SITE_URL%/",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>

    <meta name="theme-color" content="#0C0D12" />

    <!-- Critical zero-FOUC inline styling: guarantees #0C0D12 dark background and instant branded preloader -->
    <style>
      html, body {
        background-color: #0C0D12 !important;
        color: #F8FAFC !important;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: clip;
      }
      #root {
        min-height: 100vh;
        background-color: #0C0D12;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        background-color: #0C0D12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      .boot-beacon {
        width: 64px;
        height: 64px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-beacon-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(245, 158, 11, 0.45);
        animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .boot-beacon-core {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, #F59E0B, #D97706);
        box-shadow: 0 0 28px rgba(245, 158, 11, 0.85);
      }
      .boot-brand-name {
        margin-top: 24px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #FFFFFF;
      }
      .boot-progress-bar {
        margin-top: 16px;
        width: 130px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .boot-progress-val {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: linear-gradient(90deg, #F59E0B, #FBBF24);
        border-radius: 999px;
        animation: boot-shimmer 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.4); opacity: 0.12; }
      }
      @keyframes boot-shimmer {
        0% { left: -40%; width: 30%; }
        50% { width: 55%; }
        100% { left: 100%; width: 30%; }
      }
    </style>

    <!-- Preload Primary Brand Fonts for instant first paint -->
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Fonts are self-hosted from /fonts (see src/index.css). Preload the faces and first hero slide used above the fold. -->
    <script>
      // Preload the first hero photo on the home page only (inner pages don't show it)
      if (location.pathname === '/') {
        var small = matchMedia('(max-width: 767px)').matches;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.fetchPriority = 'high';
        l.setAttribute('imagesizes', '100vw');
        l.setAttribute('imagesrcset', small
          ? '/images/hero/social-phone-900.webp 900w, /images/hero/social-phone-1400.webp 1400w'
          : '/images/hero/social-phone-1600.webp 1600w, /images/hero/social-phone-1920.webp 1920w, /images/hero/social-phone-2560.webp 2560w, /images/hero/social-phone-3840.webp 3840w');
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body class="bg-[#0C0D12] text-white font-sans antialiased overflow-x-clip">
    <div id="root"></div>

    <!-- Instant Branded Initial Preloader: Smoothly dismissed once React hydrates with zero FOUC -->
    <div id="app-boot-loader" aria-label="Loading Vyral Bee">
      <div class="boot-beacon">
        <div class="boot-beacon-ring"></div>
        <div class="boot-beacon-core"></div>
      </div>
      <div class="boot-brand-name">VYRAL BEE</div>
      <div class="boot-progress-bar">
        <div class="boot-progress-val"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
